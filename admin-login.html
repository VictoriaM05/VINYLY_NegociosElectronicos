<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <title>VINYLY - Acceso de administrador</title>
</head>
<body class="admin-auth-page">
  <main class="admin-auth-shell">
    <a class="admin-auth-brand" href="landing.html" aria-label="VINYLY, volver a la tienda">
      <img src="resources/icono_vinyly.jpg" alt="VINYLY">
      <span>VINYLY <small>ADMIN</small></span>
    </a>

    <section class="auth-card admin-login-card">
      <p class="auth-eyebrow">Área privada</p>
      <h1>Acceso de administrador</h1>
      <form class="login-form" id="admin-login-form">
        <input type="text" name="correo" placeholder="Correo electrónico" inputmode="email" autocomplete="username">
        <input type="password" name="contrasena" placeholder="Contraseña" autocomplete="current-password">
        <button type="submit" class="btn-gradiente">Iniciar sesión</button>
      </form>
      <p class="auth-alt"><a href="landing.html">Volver a la tienda</a></p>
      <p class="auth-gracias" id="admin-login-message" role="status" aria-live="polite" hidden></p>
    </section>
  </main>

  <script>
    const adminLoginForm = document.getElementById('admin-login-form');
    const adminLoginMessage = document.getElementById('admin-login-message');

    adminLoginForm.addEventListener('submit', function (event) {
      event.preventDefault();
      adminLoginMessage.textContent = 'Acceso simulado. Abriendo el panel...';
      adminLoginMessage.hidden = false;
      adminLoginForm.hidden = true;

      setTimeout(function () {
        window.location.href = 'admin-dashboard.html';
      }, 1200);
    });
  </script>
</body>
</html>
