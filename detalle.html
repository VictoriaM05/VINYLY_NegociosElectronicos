<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/styles.css" />

    <title>VINYLY - Detalle del producto</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- ===== BARRA DE NAVEGACION ===== -->
  <header class="navbar">

    <a href="landing.html" class="logo">
      <img src="resources/icono_vinyly.jpg" alt="Logo VINYLY">
    </a>

    <ul class="nav-links">
      <li><a href="index.html">Inicio</a></li>
      <li><a href="catalogo.html">Catálogo</a></li>
      <li><a href="index.html#nosotros">Nosotros</a></li>
      <li><a href="contacto.html">Contacto</a></li>
    </ul>

    <div class="nav-icons">
      <a href="carrito.html">Carrito</a>
      <a href="login.html">Iniciar sesión</a>
      <a href="perfil.html" class="avatar">CV</a>
    </div>

  </header>

  <!-- ===== DETALLE DEL PRODUCTO ===== -->
  <section class="detalle">
 
    <div class="detalle-imagen" id="detalleImagen"></div>
 
    <div class="detalle-info">
      <a href="catalogo.html" class="detalle-regresar">← Regresar al catálogo</a>
 
      <h1 id="detalleNombre">Cargando...</h1>
      <p class="detalle-artista" id="detalleArtista"></p>
      <p class="detalle-precio" id="detallePrecio"></p>
 
      <p class="detalle-descripcion" id="detalleDescripcion"></p>
 
      <div class="detalle-botones">
        <div class="detalle-cantidad" aria-label="Cantidad">
          <button type="button" class="btn-cantidad" id="btnCantidadMenos" aria-label="Disminuir cantidad">-</button>
          <span id="cantidadProducto">1</span>
          <button type="button" class="btn-cantidad" id="btnCantidadMas" aria-label="Aumentar cantidad">+</button>
        </div>
        <button class="btn-gradiente" id="btnCarritoDetalle">Agregar al carrito</button>
        <p class="detalle-mensaje" id="mensajeCarrito">Agregado al carrito ✓</p>
      </div>
    </div>
 
  </section>

  <!-- ===== PRODUCTOS RELACIONADOS ===== -->
  <section class="relacionados">
    <div class="relacionados-header">
      <p class="catalogo-eyebrow">También puede gustarte</p>
      <h2>Productos relacionados</h2>
    </div>
    <div class="relacionados-grid" id="productosRelacionados"></div>
  </section>

  <!-- ===== FOOTER ===== -->
  <footer class="footer">

    <div class="footer-swirl-1"></div>
    <div class="footer-swirl-2"></div>
    <div class="footer-disco"></div>

    <div class="footer-izquierda">
      <div class="footer-columna">
        <h4>Enlaces</h4>
        <a href="landing.html">Inicio</a>
        <a href="index.html#nosotros">Nosotros</a>
      </div>

      <div class="footer-columna">
        <h4>Contacto</h4>
        <p>******</p>
        <p>www.vinyly.com</p>
      </div>
    </div>

    <div class="footer-columna footer-marca">
      <h4>VINYLY</h4>
      <p>Premium Sound, Pop Edition</p>
    </div>

  </footer>

  <script src="js/productos.js"></script>
  <script src="js/carrito.js"></script>
  <script>
  // 1. Leemos los parámetros de la URL (todo lo que va después del "?")
  const parametros = new URLSearchParams(window.location.search);

  // 2. Sacamos el valor de "id". Si no viene ninguno (o alguien abre la página sin "?id="),
  //    usamos el producto 1 como valor por defecto.
  const idProducto = Number(parametros.get('id')) || 1;

  // 3. Buscamos, dentro del arreglo "productos" (viene de productos.js),
  //    el que tenga ese mismo id.
  const producto = productos.find(function (p) {
    return p.id === idProducto;
  });

  // 4. Si lo encontramos, rellenamos cada parte de la página con sus datos.
  if (producto) {
    const imagenDetalle = document.getElementById('detalleImagen');

    // Si el producto trae una foto real (campo "foto"), la usamos como fondo.
    // Si no, usamos el cuadro de color de siempre (campo "imagen").
    if (producto.foto) {
      imagenDetalle.style.backgroundImage = `url('${producto.foto}')`;
      imagenDetalle.style.backgroundSize = 'cover';
      imagenDetalle.style.backgroundPosition = 'center';
    } else {
      imagenDetalle.classList.add(producto.imagen);
    }

    document.getElementById('detalleNombre').textContent = producto.nombre;
    document.getElementById('detalleArtista').textContent = producto.artista;
    document.getElementById('detallePrecio').textContent = producto.precio;
    document.getElementById('detalleDescripcion').textContent = producto.descripcion;
  }

  // Renderiza productos distintos al actual y respeta las fotos reales cuando existen.
  const contenedorRelacionados = document.getElementById('productosRelacionados');
  const productosRelacionados = productos
    .filter(function (productoRelacionado) {
      return productoRelacionado.id !== idProducto;
    })
    .slice(0, 4);

  productosRelacionados.forEach(function (productoRelacionado) {
    const tarjeta = document.createElement('article');
    tarjeta.className = 'producto-card';

    const imagen = document.createElement('div');
    imagen.className = `producto-img ${productoRelacionado.imagen || ''}`;
    if (productoRelacionado.foto) {
      imagen.style.backgroundImage = `url('${productoRelacionado.foto}')`;
      imagen.style.backgroundSize = 'cover';
      imagen.style.backgroundPosition = 'center';
    }

    tarjeta.innerHTML = `
      <div class="producto-info">
        <h3>${productoRelacionado.nombre}</h3>
        <p class="producto-artista">${productoRelacionado.artista}</p>
        <a href="detalle.html?id=${productoRelacionado.id}" class="producto-detalle">Ver detalle →</a>
        <div class="producto-footer">
          <span class="producto-precio">${productoRelacionado.precio}</span>
        </div>
      </div>
    `;
    tarjeta.prepend(imagen);
    contenedorRelacionados.appendChild(tarjeta);
  });

  // Controla la cantidad elegida para el producto que se está viendo.
  let cantidadProducto = 1;
  const elementoCantidad = document.getElementById('cantidadProducto');
  const btnCantidadMenos = document.getElementById('btnCantidadMenos');
  const btnCantidadMas = document.getElementById('btnCantidadMas');

  function actualizarCantidad(nuevaCantidad) {
    cantidadProducto = Math.max(1, nuevaCantidad);
    elementoCantidad.textContent = cantidadProducto;
  }

  btnCantidadMenos.addEventListener('click', function () {
    actualizarCantidad(cantidadProducto - 1);
  });

  btnCantidadMas.addEventListener('click', function () {
    actualizarCantidad(cantidadProducto + 1);
  });

  // Agrega el producto actual al carrito persistente y muestra confirmación.
  const btnCarritoDetalle = document.getElementById('btnCarritoDetalle');
  const mensajeCarrito = document.getElementById('mensajeCarrito');

  btnCarritoDetalle.addEventListener('click', function () {
    if (producto) {
      agregarAlCarrito(producto, cantidadProducto);
    }
    mensajeCarrito.classList.add('visible');
  });
</script>
 
</body>
</html>
