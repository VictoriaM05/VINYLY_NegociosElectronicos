<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
 
    <link rel="stylesheet" href="css/styles.css" />
 
    <title>VINYLY - Crear cuenta</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
 
  <!-- ===== BARRA DE NAVEGACION ===== -->
  <header class="navbar">
 
    <div class="logo">
      <img src="resources/icono_vinyly.jpg" alt="Logo VINYLY">
    </div>
 
    <ul class="nav-links">
      <li><a href="landing.html">Inicio</a></li>
      <li><a href="catalogo.html">Catálogo</a></li>
      <li><a href="index.html#nosotros">Nosotros</a></li>
    </ul>
 
    <div class="nav-icons">
      <a href="carrito.html">Carrito</a>
      <a href="login.html">Iniciar sesión</a>
      <a href="perfil.html" class="avatar">CV</a>
    </div>
 
  </header>
 
  <!-- ===== REGISTRO ===== -->
  <section class="auth">
    <div class="auth-card">
      <p class="auth-eyebrow">Únete a VINYLY</p>
      <h1>Crea tu cuenta</h1>
 
      <form class="registro-form">
        <input type="text" placeholder="Nombre completo">
        <input type="text" placeholder="Correo electrónico">
        <input type="password" placeholder="Contraseña">
        <input type="password" placeholder="Confirmar contraseña">
        <button type="submit" class="btn-gradiente">Crear cuenta</button>
      </form>
 
      <p class="auth-alt">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
    </div>
  </section>
 
  <!-- ===== FOOTER ===== -->
  <footer class="footer">
 
    <div class="footer-swirl-1"></div>
    <div class="footer-swirl-2"></div>
    <div class="footer-disco"></div>
 
    <div class="footer-izquierda">
      <div class="footer-columna">
        <h4>Enlaces</h4>
        <a href="landing.html">Inicio</a>
        <a href="index.html#nosotros">Nosotros</a>
      </div>
 
      <div class="footer-columna">
        <h4>Contacto</h4>
        <p>******</p>
        <p>www.vinyly.com</p>
      </div>
    </div>
 
    <div class="footer-columna footer-marca">
      <h4>VINYLY</h4>
      <p>Premium Sound, Pop Edition</p>
    </div>
 
  </footer>
 
  <script>
    // Agarra el formulario de registro
    const formRegistro = document.querySelector('.registro-form');
 
    formRegistro.addEventListener('submit', function (evento) {
      evento.preventDefault(); // solo simulación, no crea ninguna cuenta real
 
      formRegistro.innerHTML = '<p class="auth-gracias">¡Cuenta creada correctamente! 🎉</p>';
    });
  </script>
 
</body>
</html>
